<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 400" role="img" aria-labelledby="hero-chart-title hero-chart-description">
<title id="hero-chart-title">Cumulative quote enquiry planning range over three months</title>
<desc id="hero-chart-description">With £1,000 in advertising spend each month and £25–£45 ad spend per enquiry, the cumulative model is approximately 22–40 enquiries in month one, 44–80 by month two and 67–120 by month three. The model assumes the same cost range each month. Actual outcomes may differ.</desc>
<defs><linearGradient id="hero-curve" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3f1d68"/><stop offset=".55" stop-color="#7a2885"/><stop offset="1" stop-color="#bf4da0"/></linearGradient><linearGradient id="hero-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8238c" stop-opacity=".24"/><stop offset="1" stop-color="#532a83" stop-opacity=".07"/></linearGradient></defs>
<style>text{font-family:Jost,Arial,sans-serif}.grid{stroke:#dfd3e8;stroke-width:1}.separator{stroke:#d9cae3;stroke-width:1;stroke-dasharray:3 6}.tick{font-size:14px;fill:#80728c}.axis{font-size:13px;fill:#746480;font-weight:600;letter-spacing:1.6px}.phase{font-size:13px;fill:#5b2b87;font-weight:700;letter-spacing:1.7px}.value{font-size:19px;fill:#532a83;font-weight:600}.legend{font-size:13px;fill:#6b6377}.curveline{fill:none;stroke:url(#hero-curve);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}</style>
<text x="90" y="22" class="legend">TOTAL QUOTE ENQUIRIES · CUMULATIVE</text>
<text x="265" y="51" class="phase" text-anchor="middle">SET UP &amp; TEST</text><text x="615" y="51" class="phase" text-anchor="middle">REFINE WITH FEEDBACK</text><text x="965" y="51" class="phase" text-anchor="middle">REVIEW THE RETURN</text>
