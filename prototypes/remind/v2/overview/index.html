<!doctype html>
<!--
  Re;mind — your website, explained
  Version 1.3 (15 October 2026)

  Changelog
  1.3 (15.10.2026) — "Explain" switch in the tab bar (hidden on the SEO growth tab). It turns the pages' own
      explanation layer ("How this page brings in clients", assets/explain/) on and off inside the current
      page iframe by postMessage, follows the reader from tab to tab, and mirrors the layer's state when it is
      closed from inside the page. Inside this shell the page's floating pill steps aside (the switch does its
      job) and the layer's panel / bottom sheet follow the visible region like the menu and the dialog.
  1.2 (15.10.2026) — The explainer moves out to readme/index.html (its own page, version 1.0) and the fourth
      tab embeds it in a self-sizing iframe like the other three, so the explainer has one source. The
      one-line strip above each page iframe is gone: tabs 1–3 show the pages exactly as a visitor would see
      them. Internal wording ("example page", "not yet live") removed from the shell. The explainer's own
      brand bar is hidden while it sits inside this shell, since the tab bar does that job. Tab order,
      labels, hash routing, default tab (SEO growth), keyboard behaviour and iframe sizing unchanged.
      Styles trimmed to what the shell still uses.
  1.1 (14.10.2026) — Opening section of the SEO growth tab gains a right-hand pillar in the site's hero grammar:
      the homepage's Solent photograph (images/v2/hampshire-landscape, AVIF/WebP) with a frosted summary card
      "What this means for Re;mind" (three plain outcomes and a link to the fifty-page plan, now anchored #plan).
      Reading column and its 20px / 18px sizes unchanged. Tablets: photo band with the card overlapping it;
      phones: one column, photo hidden, card below the text.
  1.0 (14.10.2026) — First version. Four-tab shell (Local service page · Case study · Service page · SEO growth)
      over the three Re;mind v2 pages, with the client explainer as the default tab. Styles are copied
      from src/css (tokens, fonts, base, layout, sections, footer, mobile) so the file stays self-contained and
      matches the site; the one deliberate difference is the explainer's larger reading size (20px / 18px).
      Copy checked against content/*.json, research/keyword-vr-therapy.md, research/serp-analysis-vr-therapy.md
      and research/facts.md. No search volumes quoted (none available). Page tabs embed the live pages in
      same-origin iframes that size themselves to their content; the hero's viewport-based height, the mobile
      menu and the privacy dialog are pinned to the visible region from the outer page so the embedded pages
      behave as they would on their own.
-->

<style>
/* ===== fonts.css (paths relative to /overview/) ===== */
@font-face { font-family: "Inter"; font-style: normal; font-weight: 400; font-display: swap; src: url(../fonts/inter-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Inter"; font-style: normal; font-weight: 500; font-display: swap; src: url(../fonts/inter-latin-500-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Inter Fallback"; src: local("Arial"); ascent-override: 90.44%; descent-override: 22.52%; line-gap-override: 0%; size-adjust: 107.12%; }

/* ===== tokens.css (the ones the shell uses) ===== */
:root {
  --forest: #006b54; --forest-deep: #00553f; --forest-soft: #e4f3ec; --mint: #00c096;
  --ivory: #fbfdf9; --ink: #17252a; --ink-2: #22352f; --faint: #7a918a; --line-soft: #d8e8e0;
  --font: "Inter", "Inter Fallback", system-ui, -apple-system, "Segoe UI", sans-serif;
  --text-body: 1.1875rem; --text-small: 1.0625rem; --lh-body: 1.6;
  --container: 1200px; --gutter: 48px;
  --radius-control: 6px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1); --dur: 220ms;
  /* overview shell */
  --bar-h: 56px;
}

/* ===== base.css (the rules the shell uses) ===== */
*, *::before, *::after { box-sizing: border-box; }
html { font-family: var(--font); -webkit-text-size-adjust: 100%; scroll-behavior: auto; background: var(--ivory); color: var(--ink-2); }
body { margin: 0; font-size: var(--text-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-synthesis: none; text-rendering: optimizeLegibility; min-height: 100svh; overflow-x: clip; }
img, svg { display: block; max-width: 100%; }
img { height: auto; }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 0.18em; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button, a { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
::selection { background: #b7efd8; color: #123a30; }
:focus-visible { outline: 2px solid var(--forest); outline-offset: 3px; border-radius: 2px; }
[hidden] { display: none !important; }
.skip-link { position: fixed; top: -100px; left: 16px; z-index: 300; background: var(--forest); color: #fff; padding: 12px 18px; border-radius: var(--radius-control); font-weight: 500; text-decoration: none; }
.skip-link:focus { top: 12px; outline-color: var(--mint); }

/* ===== layout.css ===== */
.container { width: min(var(--container), 100% - var(--gutter) * 2); margin-inline: auto; }

/* ===== overview shell: the sticky tab bar (same look as the site header, 56px) ===== */
.ov-bar { position: sticky; top: 0; z-index: 90; height: var(--bar-h); background: rgba(251, 253, 249, 0.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 1px 0 var(--line-soft); transition: box-shadow var(--dur); }
.ov-bar.is-scrolled { box-shadow: 0 1px 0 var(--line-soft), 0 12px 30px -24px rgba(7, 62, 48, 0.4); }
.ov-bar-inner { display: flex; align-items: center; height: 100%; gap: 24px; }
.brand { display: inline-flex; align-items: center; gap: 14px; text-decoration: none; color: var(--ink); flex: none; }
.brand-mark { width: 44px; height: 44px; border-radius: 50%; }
.brand-name { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ov-tabs { display: flex; align-items: center; gap: 4px; flex: 1 1 auto; justify-content: center; min-width: 0; }
.ov-tab { position: relative; display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 14px; font-size: var(--text-small); font-weight: 500; color: var(--ink); border-radius: var(--radius-control); white-space: nowrap; }
.ov-tab::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 7px; height: 1px; background: var(--forest); transform: scaleX(0); transform-origin: left; transition: transform var(--dur) var(--ease); }
.ov-tab:hover { color: var(--forest); }
.ov-tab:hover::after { transform: scaleX(1); }
.ov-tab[aria-selected="true"] { color: var(--forest); }
.ov-tab[aria-selected="true"]::after { transform: scaleX(1); height: 2px; }
.ov-tab-short { display: none; }
.ov-spacer { flex: none; width: 44px; }

/* the Explain switch: turns the pages' explanation layer on inside the current tab */
.ov-explain { flex: none; display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 6px 0 12px; border-radius: var(--radius-control); font-size: var(--text-small); font-weight: 500; color: var(--ink); white-space: nowrap; }
.ov-explain:hover { color: var(--forest); }
.ov-explain[hidden] { display: none; }
.ov-switch { position: relative; flex: none; width: 38px; height: 22px; border-radius: 11px; background: var(--faint); transition: background var(--dur); }
.ov-switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); transition: transform var(--dur) var(--ease); }
.ov-explain[aria-pressed="true"] { color: var(--forest); }
.ov-explain[aria-pressed="true"] .ov-switch { background: var(--forest); }
.ov-explain[aria-pressed="true"] .ov-switch::after { transform: translateX(16px); }

/* ===== the tabs: each one is the page itself, sized to its content ===== */
.ov-frame { display: block; background: var(--ivory); }
.ov-frame iframe { display: block; width: 100%; border: 0; min-height: 320px; height: calc(100dvh - var(--bar-h)); background: var(--ivory); }
.ov-frame iframe.is-fitted { height: auto; }
.ov-frame iframe.is-fixed { height: calc(100dvh - var(--bar-h)); }

/* ===== mobile.css (the rules the shell needs) ===== */
@media (max-width: 1099px) {
  :root { --gutter: 32px; }
}
@media (max-width: 759px) {
  :root { --gutter: 24px; --text-body: 1.125rem; --text-small: 1.0625rem; }
  /* tab bar on phones: all four tabs fit, 44px tall */
  .ov-bar .container { width: calc(100% - 24px); }
  .ov-bar-inner { gap: 10px; }
  .brand-mark { width: 40px; height: 40px; }
  .ov-tabs { gap: 0; justify-content: space-between; }
  .ov-tab { flex: 1 1 0; min-width: 0; padding: 0 6px; font-size: 0.9375rem; }
  .ov-tab::after { left: 6px; right: 6px; }
  .ov-spacer { display: none; }
  .ov-explain { padding: 0 4px; gap: 0; }
  .ov-explain-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
}
@media (max-width: 480px) {
  .ov-tab-long { display: none; }
  .ov-tab-short { display: inline; }
  .ov-bar .brand { display: none; }
  .ov-tab { padding: 0 4px; font-size: 0.875rem; }
  .ov-tab::after { left: 4px; right: 4px; }
}
@media (max-width: 359px) {
  .ov-tab { font-size: 0.8125rem; padding: 0 2px; letter-spacing: -0.01em; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}
</style>
</head>

<script>
(function () {
  'use strict';
  var BAR = 56;
  var DEFAULT = 'growth';
  var tabs = Array.prototype.slice.call(document.querySelectorAll('[role="tab"]'));
  var panels = Array.prototype.slice.call(document.querySelectorAll('[role="tabpanel"]'));
  var ids = tabs.map(function (t) { return t.dataset.tab; });
  var bar = document.querySelector('[data-bar]');
  var current = null;
  var frames = new Map();

  /* ---- the Explain switch: drives the page's own explanation layer inside the current iframe ---- */
  var explainSwitch = document.querySelector('[data-explain-switch]');
  var explainOn = false;
  function setSwitch(on) { explainOn = on; explainSwitch.setAttribute('aria-pressed', on ? 'true' : 'false'); }
  function postExplain(f) {
    if (!f || !frames.get(f)) return;
    try { f.contentWindow.postMessage({ type: 'remind-explain', on: explainOn }, location.origin); } catch (e) { /* not reachable */ }
  }
  explainSwitch.addEventListener('click', function () { setSwitch(!explainOn); postExplain(frameOf(panelFor(current))); });
  window.addEventListener('message', function (ev) {
    if (ev.origin !== location.origin || !ev.data || ev.data.type !== 'remind-explain-state') return;
    var f = frameOf(panelFor(current));
    if (f && ev.source === f.contentWindow) setSwitch(Boolean(ev.data.on));
  });

  /* Jumps are instant on purpose: no scripted motion, and a jump that lands exactly beats one that drifts. */
  function behaviour() { return 'instant'; }
  function panelFor(id) { return panels.filter(function (p) { return p.dataset.panel === id; })[0]; }
  function frameOf(panel) { return panel ? panel.querySelector('iframe[data-src]') : null; }
  function pathOf(src) { return new URL(src, location.href).pathname.replace(/index\.html$/, ''); }

  /* ---- tabs ---- */
  function activate(id) {
    if (ids.indexOf(id) === -1) id = DEFAULT;
    tabs.forEach(function (t) {
      var on = t.dataset.tab === id;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
    });
    panels.forEach(function (p) {
      var on = p.dataset.panel === id;
      p.hidden = !on;
      if (on) mount(p);
    });
    var changed = current !== id;
    current = id;
    explainSwitch.hidden = id === 'growth';
    if (changed && id !== 'growth') postExplain(frameOf(panelFor(id)));
    return changed;
  }
  function mount(panel) {
    var f = frameOf(panel);
    if (!f) return;
    if (!f.getAttribute('src')) { f.src = f.dataset.src; }
    else { var st = frames.get(f); if (st) requestAnimationFrame(function () { st.measure(); syncVars(f); }); }
  }
  function route(opts) {
    opts = opts || {};
    var raw = '';
    try { raw = decodeURIComponent(location.hash.slice(1)); } catch (e) { raw = location.hash.slice(1); }
    var id = DEFAULT, target = null;
    if (ids.indexOf(raw) !== -1) { id = raw; }
    else if (raw) {
      var el = document.getElementById(raw);
      if (el) { var p = el.closest('[role="tabpanel"]'); id = p ? p.dataset.panel : (current || DEFAULT); target = el; }
    }
    var changed = activate(id);
    if (target) {
      scrollToEl(target, false); focusEl(target);
      /* On first load the web font arrives after this runs and text reflows; land again once it is in. */
      if (opts.initial && document.fonts && document.fonts.ready) { document.fonts.ready.then(function () { scrollToEl(target, false); }); }
    }
    else if (changed && !opts.initial) { window.scrollTo({ top: 0, behavior: 'instant' }); }
  }
  function go(hash) {
    if (location.hash !== hash) history.pushState(null, '', hash);
    route();
  }
  function scrollToEl(el, smooth) {
    var y = el.getBoundingClientRect().top + window.scrollY - BAR - 16;
    window.scrollTo({ top: Math.max(0, y), behavior: 'instant' });
  }
  function focusEl(el) {
    if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '-1');
    try { el.focus({ preventScroll: true }); } catch (e) { /* older engines */ }
  }

  tabs.forEach(function (t) { t.addEventListener('click', function () { go('#' + t.dataset.tab); }); });
  document.querySelector('[role="tablist"]').addEventListener('keydown', function (ev) {
    var i = tabs.indexOf(document.activeElement);
    if (i === -1) return;
    var n = null;
    if (ev.key === 'ArrowRight' || ev.key === 'ArrowDown') n = (i + 1) % tabs.length;
    else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowUp') n = (i - 1 + tabs.length) % tabs.length;
    else if (ev.key === 'Home') n = 0;
    else if (ev.key === 'End') n = tabs.length - 1;
    if (n === null) return;
    ev.preventDefault();
    tabs[n].focus();
    go('#' + tabs[n].dataset.tab);
  });
  document.addEventListener('click', function (ev) {
    var a = ev.target.closest ? ev.target.closest('a[href^="#"]') : null;
    if (!a) return;
    ev.preventDefault();
    go(a.getAttribute('href'));
  });
  window.addEventListener('popstate', function () { route(); });

  /* ---- bar shadow + visible-region variables for the embedded page ---- */
  var ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      ticking = false;
      bar.classList.toggle('is-scrolled', window.scrollY > 8);
      var f = frameOf(panelFor(current));
      if (f) syncVars(f);
    });
  }
  window.addEventListener('scroll', onScroll, { passive: true });

  function syncVars(f) {
    var st = frames.get(f);
    if (!st) return;
    var rect = f.getBoundingClientRect();
    var top = Math.max(0, BAR - rect.top);
    var vh = Math.max(200, window.innerHeight - BAR);
    st.doc.documentElement.style.setProperty('--ov-top', Math.round(top) + 'px');
    st.doc.documentElement.style.setProperty('--ov-vh', Math.round(vh) + 'px');
  }

  /* ---- embedded pages: size to content, keep anchors, menu and dialog usable ---- */
  function injectStyle(doc) {
    var st = doc.getElementById('ov-embed');
    if (!st) { st = doc.createElement('style'); st.id = 'ov-embed'; (doc.head || doc.documentElement).appendChild(st); }
    var vh = Math.max(320, window.innerHeight);
    var sheet = Math.min(Math.round((vh - BAR) * 0.62), 600);
    st.textContent =
      'body{min-height:0!important}' +
      '@media (min-width:760px){.hero{min-height:calc((' + vh + 'px - var(--header-h)) * .66)!important}}' +
      '.mobile-menu{position:absolute!important;inset:auto 0 auto 0!important;top:var(--ov-top,0px)!important;height:var(--ov-vh,' + vh + 'px)!important}' +
      '.privacy{position:absolute!important;inset:auto 0 auto 0!important;top:calc(var(--ov-top,0px) + 24px)!important;margin:0 auto!important;max-height:calc(var(--ov-vh,' + vh + 'px) - 48px)!important}' +
      /* the explainer's own brand bar steps aside inside this shell: the tab bar does its job here */
      '.rm-bar{display:none!important}' +
      /* the explanation layer: the tab bar's switch drives it, so the page's own pill steps aside; its panel
         (desktop) and bottom sheet (phones) follow the visible region like the menu and the dialog */
      '.xp-pill{display:none!important}' +
      '@media (min-width:1024px){.xp-panel{position:absolute!important;top:var(--ov-top,0px)!important;bottom:auto!important;height:var(--ov-vh,' + vh + 'px)!important}}' +
      '@media (max-width:1023px){.xp-panel{position:absolute!important;bottom:auto!important;top:calc(var(--ov-top,0px) + var(--ov-vh,' + vh + 'px) - ' + sheet + 'px)!important;height:' + sheet + 'px!important;max-height:none!important}' +
      '.xp-panel.is-folded{top:calc(var(--ov-top,0px) + var(--ov-vh,' + vh + 'px) - 72px)!important;height:72px!important}}';
  }
  function innerTarget(doc, id) {
    if (!id) return null;
    var el = doc.getElementById(id);
    if (!el && doc.querySelector) { try { el = doc.querySelector('[name="' + CSS.escape(id) + '"]'); } catch (e) { el = null; } }
    return el;
  }
  function scrollToInner(f, el, smooth) {
    var base = f.getBoundingClientRect().top + window.scrollY;
    var y = el ? base + el.getBoundingClientRect().top - BAR - 16 : base - BAR;
    window.scrollTo({ top: Math.max(0, y), behavior: behaviour() });
  }
  function onInnerClick(ev, f, doc) {
    var a = ev.target && ev.target.closest ? ev.target.closest('a[href]') : null;
    if (!a) return;
    var url;
    try { url = new URL(a.getAttribute('href'), doc.location.href); } catch (e) { return; }
    if (url.origin !== doc.location.origin) {
      if (/^https?:$/.test(url.protocol)) { ev.preventDefault(); window.open(url.href, '_blank', 'noopener'); }
      return;
    }
    if (url.pathname === doc.location.pathname && url.search === doc.location.search) {
      var id = '';
      try { id = decodeURIComponent(url.hash.slice(1)); } catch (e) { id = url.hash.slice(1); }
      var el = innerTarget(doc, id);
      if (id && !el && id !== 'top') return;
      ev.preventDefault();
      scrollToInner(f, el);
      if (el) { if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '-1'); try { el.focus({ preventScroll: true }); } catch (e2) {} }
    }
  }
  function syncTab(f, doc) {
    var here = doc.location.pathname.replace(/index\.html$/, '');
    if (here === pathOf(f.dataset.src)) return false;
    var other = panels.filter(function (p) { var g = frameOf(p); return g && pathOf(g.dataset.src) === here; })[0];
    if (!other) return false;
    var hash = doc.location.hash;
    var g = frameOf(other);
    if (!g.getAttribute('src')) { g.src = g.dataset.src + hash; }
    go('#' + other.dataset.panel);
    if (g.getAttribute('src') && hash && frames.get(g)) {
      var el = innerTarget(frames.get(g).doc, hash.slice(1));
      if (el) requestAnimationFrame(function () { scrollToInner(g, el, false); });
    }
    f.src = f.dataset.src;
    return true;
  }
  function fit(f) {
    var doc;
    try {
      doc = f.contentDocument;
      if (!doc || !doc.documentElement || doc.location.href === 'about:blank') throw new Error('unreadable');
    } catch (e) {
      f.classList.remove('is-fitted'); f.classList.add('is-fixed'); f.style.height = '';
      return;
    }
    var prev = frames.get(f);
    if (prev && prev.ro) prev.ro.disconnect();
    if (syncTab(f, doc)) return;
    var state = { doc: doc, ro: null, measure: null };
    frames.set(f, state);
    injectStyle(doc);
    state.measure = function () {
      var h = Math.ceil(Math.max(doc.documentElement.getBoundingClientRect().height, doc.body ? doc.body.getBoundingClientRect().height : 0));
      if (h > 0 && Math.abs(h - f.offsetHeight) > 1) { f.style.height = h + 'px'; }
    };
    f.classList.remove('is-fixed'); f.classList.add('is-fitted');
    state.measure();
    if ('ResizeObserver' in window) {
      state.ro = new ResizeObserver(function () { state.measure(); });
      state.ro.observe(doc.documentElement);
      if (doc.body) state.ro.observe(doc.body);
    } else {
      setInterval(state.measure, 800);
    }
    doc.addEventListener('click', function (ev) { onInnerClick(ev, f, doc); }, true);
    syncVars(f);
    if (explainOn && f === frameOf(panelFor(current))) postExplain(f);
    var hash = '';
    try { hash = decodeURIComponent(doc.location.hash.slice(1)); } catch (e) { hash = doc.location.hash.slice(1); }
    if (hash) { var el = innerTarget(doc, hash); if (el) requestAnimationFrame(function () { scrollToInner(f, el, false); }); }
  }
  panels.forEach(function (p) {
    var f = frameOf(p);
    if (f) f.addEventListener('load', function () { fit(f); });
  });
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      frames.forEach(function (st, f) { injectStyle(st.doc); st.measure(); syncVars(f); });
    }, 120);
  });

  /* ---- start ---- */
  if (!location.hash || location.hash === '#') history.replaceState(null, '', '#' + DEFAULT);
  route({ initial: true });
  onScroll();
})();
</script>
</body>
