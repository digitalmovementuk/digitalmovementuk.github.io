<!doctype html>
<!--
  Re;mind — design directions hub
  Version 1.1

  Change log
  - 1.1 (15.10.2026) — First hub release. One page with a slim sticky tab bar that switches
    between the six homepage directions (Grove, Atrium, Hearth, Echo, Pause, Clarity). Each direction
    loads lazily into its own iframe and stays alive once loaded; deep links #grove … #pause;
    browser back/forward; keyboard tab navigation (arrow keys, Home, End).
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2FCF7">
<title>Re;mind — design directions</title>
<link rel="icon" href="hub-assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #006B54;
    --mint: #00C096;
    --pale: #F2FCF7;
    --ink: #17252A;
    --ink-soft: rgba(23, 37, 42, .72);
    --line: rgba(0, 107, 84, .16);
    --hover: rgba(0, 192, 150, .14);
    --bar-h: 40px;
    --pill-h: 26px;
    --font: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  @media (max-width: 767px), (pointer: coarse) {
    :root { --bar-h: 44px; --pill-h: 28px; }
  }

  * { box-sizing: border-box; }
  html { height: 100%; background: var(--pale); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--pale);
    color: var(--ink);
    font-family: var(--font);
    font-size: 13px;
    line-height: 1;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- top bar ---------- */
  .bar {
    position: sticky;
    top: 0;
    z-index: 10;
    flex: 0 0 var(--bar-h);
    height: var(--bar-h);
    display: flex;
    align-items: center;
    background: var(--pale);
    box-shadow: 0 1px 0 var(--line); /* hairline painted outside the box so tabs keep the full bar height */
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  .mark {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: var(--bar-h);
    height: var(--bar-h);
  }
  .mark img { width: 22px; height: 22px; display: block; }

  .tabs {
    flex: 1 1 auto;
    min-width: 0;
    height: 100%;
    display: flex;
    align-items: stretch;
    gap: 2px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity;
    padding: 0 6px;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs[data-more-right] { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 32px), transparent); }
  .tabs[data-more-left] { -webkit-mask-image: linear-gradient(90deg, transparent, #000 32px); mask-image: linear-gradient(90deg, transparent, #000 32px); }
  .tabs[data-more-left][data-more-right] { -webkit-mask-image: linear-gradient(90deg, transparent, #000 32px, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(90deg, transparent, #000 32px, #000 calc(100% - 32px), transparent); }

  .tab {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    height: 100%;
    margin: 0;
    padding: 0 2px;
    border: 0;
    background: none;
    color: var(--ink-soft);
    font: inherit;
    font-weight: 500;
    letter-spacing: .01em;
    cursor: pointer;
    scroll-snap-align: center;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .tab__label {
    display: inline-flex;
    align-items: center;
    height: var(--pill-h);
    padding: 0 12px;
    border-radius: 999px;
    white-space: nowrap;
    transition: background-color .15s ease, color .15s ease;
  }
  .tab:hover .tab__label { background: var(--hover); color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--pale); }
  .tab[aria-selected="true"] .tab__label { background: var(--ink); color: var(--pale); font-weight: 600; }
  .tab:focus { outline: none; }
  .tab:focus-visible .tab__label { outline: 2px solid var(--mint); outline-offset: 2px; }

  .open {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: var(--bar-h);
    height: var(--bar-h);
    color: var(--green);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .open svg { width: 16px; height: 16px; display: block; }
  .open:hover { color: var(--ink); }
  .open:focus { outline: none; }
  .open:focus-visible svg { outline: 2px solid var(--mint); outline-offset: 4px; border-radius: 2px; }

  /* ---------- stage ---------- */
  .stage { position: relative; flex: 1 1 auto; min-height: 0; background: var(--pale); }
  .panel { position: absolute; inset: 0; }
  .panel[hidden] { display: none; }
  .panel iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--pale); }

  .loading {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: var(--pale);
    color: var(--ink-soft);
    font-size: 13px;
    letter-spacing: .01em;
    transition: opacity .35s ease;
    pointer-events: none;
  }
  .loading__line { width: 72px; height: 2px; background: rgba(0, 107, 84, .14); overflow: hidden; border-radius: 1px; }
  .loading__line::after { content: ""; display: block; width: 40%; height: 100%; background: var(--mint); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  .panel.is-loaded .loading { opacity: 0; }
  .panel.is-settled .loading { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .loading__line::after { animation: none; width: 100%; background: var(--mint); opacity: .6; }
    .tab__label, .loading { transition: none; }
  }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
</style>
</head>
<body>

<header class="bar">
  <a class="mark" href="#grove" aria-label="Re;mind — back to Design Grove"><img src="hub-assets/favicon.svg" alt="" width="22" height="22"></a>
  <div class="tabs" role="tablist" aria-label="Design directions">
    <button class="tab" role="tab" id="tab-grove"  aria-controls="panel-grove"  aria-selected="false" tabindex="-1" data-key="grove"><span class="tab__label">Design Grove</span></button>
    <button class="tab" role="tab" id="tab-atrium" aria-controls="panel-atrium" aria-selected="false" tabindex="-1" data-key="atrium"><span class="tab__label">Design Atrium</span></button>
    <button class="tab" role="tab" id="tab-hearth" aria-controls="panel-hearth" aria-selected="false" tabindex="-1" data-key="hearth"><span class="tab__label">Design Hearth</span></button>
    <button class="tab" role="tab" id="tab-echo"   aria-controls="panel-echo"   aria-selected="false" tabindex="-1" data-key="echo"><span class="tab__label">Design Echo</span></button>
    <button class="tab" role="tab" id="tab-pause"  aria-controls="panel-pause"  aria-selected="false" tabindex="-1" data-key="pause"><span class="tab__label">Design Pause</span></button>
    <button class="tab" role="tab" id="tab-clarity"  aria-controls="panel-clarity"  aria-selected="false" tabindex="-1" data-key="clarity"><span class="tab__label">Design Clarity</span></button>
  </div>
  <a class="open" id="open-full" href="grove/index.html" target="_blank" rel="noopener" aria-label="Open Design Grove full screen (new tab)" title="Open full screen">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M6.5 3.5H3.5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V9.5"/>
      <path d="M9.5 2.5h4v4"/>
      <path d="M13.5 2.5 7.5 8.5"/>
    </svg>
  </a>
</header>

<main class="stage" id="stage">
  <div class="panel" role="tabpanel" id="panel-grove"  aria-labelledby="tab-grove"  data-key="grove"  hidden></div>
  <div class="panel" role="tabpanel" id="panel-atrium" aria-labelledby="tab-atrium" data-key="atrium" hidden></div>
  <div class="panel" role="tabpanel" id="panel-hearth" aria-labelledby="tab-hearth" data-key="hearth" hidden></div>
  <div class="panel" role="tabpanel" id="panel-echo"   aria-labelledby="tab-echo"   data-key="echo"   hidden></div>
  <div class="panel" role="tabpanel" id="panel-pause"  aria-labelledby="tab-pause"  data-key="pause"  hidden></div>
  <div class="panel" role="tabpanel" id="panel-clarity"  aria-labelledby="tab-clarity"  data-key="clarity"  hidden></div>
  <p class="sr-only" id="status" aria-live="polite"></p>
</main>

<script>
(function () {
  'use strict';
  var KEYS = ['grove', 'atrium', 'hearth', 'echo', 'pause', 'clarity'];
  var NAMES = { grove: 'Design Grove', atrium: 'Design Atrium', hearth: 'Design Hearth', echo: 'Design Echo', pause: 'Design Pause', clarity: 'Design Clarity' };
  var DEFAULT = 'grove';

  var tablist = document.querySelector('.tabs');
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var panels = {};
  Array.prototype.forEach.call(document.querySelectorAll('.panel'), function (p) { panels[p.dataset.key] = p; });
  var openLink = document.getElementById('open-full');
  var status = document.getElementById('status');
  var current = null;

  function keyFromHash() {
    var h = (location.hash || '').replace(/^#/, '').toLowerCase();
    return KEYS.indexOf(h) > -1 ? h : null;
  }

  function ensureFrame(key) {
    var panel = panels[key];
    if (panel.querySelector('iframe')) { return; }
    var loading = document.createElement('div');
    loading.className = 'loading';
    loading.setAttribute('aria-hidden', 'true');
    loading.innerHTML = '<span class="loading__line"></span><span>Loading ' + NAMES[key] + '</span>';
    var frame = document.createElement('iframe');
    frame.src = key + '/index.html';
    frame.title = NAMES[key] + ' — Re;mind homepage direction';
    frame.setAttribute('loading', 'eager');
    frame.setAttribute('allow', 'autoplay; fullscreen');
    var settle = function () {
      if (panel.classList.contains('is-loaded')) { return; }
      panel.classList.add('is-loaded');
      window.setTimeout(function () { panel.classList.add('is-settled'); }, 400);
    };
    frame.addEventListener('load', settle);
    window.setTimeout(settle, 12000);
    panel.appendChild(frame);
    panel.appendChild(loading);
  }

  function activate(key, opts) {
    opts = opts || {};
    if (KEYS.indexOf(key) === -1) { key = DEFAULT; }
    if (key === current && !opts.force) { return; }
    current = key;
    tabs.forEach(function (tab) {
      var on = tab.dataset.key === key;
      tab.setAttribute('aria-selected', on ? 'true' : 'false');
      tab.tabIndex = on ? 0 : -1;
      if (on) {
        if (opts.focus) { tab.focus({ preventScroll: true }); }
        if (tab.scrollIntoView) { tab.scrollIntoView({ block: 'nearest', inline: 'center', behavior: opts.smooth ? 'smooth' : 'auto' }); }
      }
    });
    KEYS.forEach(function (k) { panels[k].hidden = (k !== key); });
    ensureFrame(key);
    openLink.href = key + '/index.html';
    openLink.setAttribute('aria-label', 'Open ' + NAMES[key] + ' full screen (new tab)');
    document.title = 'Re;mind — design directions · ' + NAMES[key].replace('Design ', '');
    status.textContent = NAMES[key] + ' shown';
    updateEdges();
  }

  function go(key) {
    if ('#' + key === location.hash) { activate(key, { smooth: true }); return; }
    location.hash = key;
  }

  function updateEdges() {
    var more = tablist.scrollWidth - tablist.clientWidth > 2;
    var left = more && tablist.scrollLeft > 2;
    var right = more && (tablist.scrollLeft + tablist.clientWidth < tablist.scrollWidth - 2);
    if (left) { tablist.setAttribute('data-more-left', ''); } else { tablist.removeAttribute('data-more-left'); }
    if (right) { tablist.setAttribute('data-more-right', ''); } else { tablist.removeAttribute('data-more-right'); }
  }

  tabs.forEach(function (tab, i) {
    tab.addEventListener('click', function () { go(tab.dataset.key); });
    tab.addEventListener('keydown', function (e) {
      var n = tabs.length, next = null;
      switch (e.key) {
        case 'ArrowRight': case 'Right': next = (i + 1) % n; break;
        case 'ArrowLeft':  case 'Left':  next = (i - 1 + n) % n; break;
        case 'Home': next = 0; break;
        case 'End':  next = n - 1; break;
        case 'Enter': case ' ': case 'Spacebar': go(tab.dataset.key); e.preventDefault(); return;
        default: return;
      }
      e.preventDefault();
      var target = tabs[next];
      target.focus({ preventScroll: true });
      go(target.dataset.key);
    });
  });

  window.addEventListener('hashchange', function () {
    var key = keyFromHash();
    if (key) { activate(key, { smooth: true, focus: document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('tab') }); }
    else { activate(DEFAULT, { smooth: true }); }
  });

  tablist.addEventListener('scroll', updateEdges, { passive: true });
  window.addEventListener('resize', updateEdges);

  var first = keyFromHash();
  if (!first) {
    first = DEFAULT;
    try { history.replaceState(null, '', '#' + DEFAULT); } catch (err) { /* file:// in some browsers */ }
  }
  activate(first, { force: true });
})();
</script>
</body>
</html>
